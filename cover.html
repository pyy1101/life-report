<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');
body{margin:0;padding:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#0a0a0f;font-family:'Noto Serif SC',serif}
.card{width:800px;height:600px;background:linear-gradient(180deg,#0c0a20,#1a1040 40%,#0e0c2a 70%,#0a0a1a);border-radius:24px;overflow:hidden;text-align:center;position:relative;box-shadow:0 0 120px rgba(100,60,160,.3)}
.moon{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35%35%,#f5e6d3,#d4b896 40%,#8b6c9a 72%,transparent 74%);box-shadow:0 0 60px rgba(200,160,120,.2)}
.content{padding:180px 40px 0;position:relative;z-index:1}
.badge{display:inline-block;padding:8px 24px;border:1px solid rgba(180,140,220,.4);border-radius:20px;font-size:14px;color:#b48cdc;letter-spacing:3px;margin-bottom:28px}
h1{font-size:48px;font-weight:900;background:linear-gradient(180deg,#f0e0cc,#d4b896 40%,#c4a080 70%,#8b6c9a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px;letter-spacing:4px}
.sub{font-size:20px;color:rgba(200,190,170,.5);letter-spacing:4px;margin-bottom:36px}
.features{display:flex;justify-content:center;gap:40px}
.feature{text-align:center}
.feature .icon{font-size:32px;margin-bottom:8px}
.feature .label{font-size:14px;color:rgba(200,190,170,.45);letter-spacing:1px}
</style></head><body>
<div class="card">
  <div class="moon"></div>
  <div class="content">
    <div class="badge">探寻命运密码</div>
    <h1>隐藏人生剧本</h1>
    <div class="sub">前世身份 · 隐藏天赋 · 年度奇遇 · 命运修复</div>
    <div class="features">
      <div class="feature"><div class="icon">🔮</div><div class="label">AI命运报告</div></div>
      <div class="feature"><div class="icon">✨</div><div class="label">隐藏天赋</div></div>
      <div class="feature"><div class="icon">📸</div><div class="label">分享朋友圈</div></div>
    </div>
  </div>
</div>
</body></html>
